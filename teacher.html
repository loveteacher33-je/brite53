<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인생 뽑기 카드 - 교사 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: #f0f4f8; min-height: 100vh; }
    </style>
</head>
<body class="p-4 sm:p-6">

    <div class="max-w-5xl mx-auto space-y-6">
        <div class="bg-white rounded-2xl p-4 shadow-sm flex justify-between items-center">
            <div>
                <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full">도덕 5학년 - 공동체를 정의롭게</span>
                <h1 class="text-xl font-extrabold text-gray-800 mt-1">📊 교사 전용 실시간 대시보드</h1>
            </div>
            <span id="tcNetStatus" class="text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-xl">🟢 네트워크 연결됨</span>
        </div>

        <div class="bg-white p-5 rounded-3xl shadow-sm border space-y-4">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-3">
                <div class="flex items-center space-x-3">
                    <span id="tcLockBadge" class="px-3 py-1 bg-emerald-100 text-emerald-700 font-extrabold text-xs rounded-full">🔓 입력 허용</span>
                    <h2 id="tcCurrentLawTitle" class="font-extrabold text-gray-800 text-base">상황 1: 노인 승차 & 10대 지원금</h2>
                </div>
                <div class="flex space-x-2 w-full sm:w-auto">
                    <button onclick="tcNavLaw(-1)" class="px-3.5 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-xs rounded-xl">◀ 이전 법안</button>
                    <button onclick="tcNavLaw(1)" class="px-3.5 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-xs rounded-xl">다음 법안 ▶</button>
                    <button id="tcLockToggleBtn" onclick="toggleStudentLock()" class="px-4 py-2 bg-rose-600 text-white font-bold text-xs rounded-xl shadow">🔒 학생 입력 잠그기</button>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border text-center">
                <span class="text-xs text-gray-500 font-bold">총 응답 건수</span>
                <p id="dashTotalCount" class="text-2xl font-black text-gray-800 mt-1">0건</p>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border text-center">
                <span class="text-xs text-gray-500 font-bold">1차 찬성 비율</span>
                <p id="dashVote1Ratio" class="text-2xl font-black text-emerald-600 mt-1">0%</p>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border text-center">
                <span class="text-xs text-gray-500 font-bold">2차 찬성 비율</span>
                <p id="dashVote2Ratio" class="text-2xl font-black text-indigo-600 mt-1">0%</p>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border text-center">
                <span class="text-xs text-gray-500 font-bold">입장 전환율</span>
                <p id="dashChangeRatio" class="text-2xl font-black text-amber-500 mt-1">0%</p>
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-sm border space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-gray-800">📊 법안별 실시간 찬반 변화 (1차 vs 2차)</h3>
                <select id="tcLawFilter" onchange="renderDashboard()" class="p-2 border rounded-xl text-xs font-bold text-gray-700">
                    <option value="all">전체 법안 합계</option>
                    <option value="0">상황 1 (연령 카테고리)</option>
                    <option value="1">상황 2 (소득 카테고리)</option>
                    <option value="2">상황 3 (국적 카테고리)</option>
                    <option value="3">상황 4 (종교 카테고리)</option>
                    <option value="4">상황 5 (가족 카테고리)</option>
                    <option value="5">상황 6 (건강 카테고리)</option>
                </select>
            </div>
            <div class="h-64"><canvas id="liveChart"></canvas></div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-sm border space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-gray-800">📋 학생별 제출 소감 실시간 모니터링</h3>
                <button onclick="clearData()" class="px-3 py-1.5 bg-rose-50 text-rose-700 border border-rose-200 rounded-lg text-xs font-bold">🗑️ 데이터 초기화</button>
            </div>
            <div id="reflectionListContainer" class="space-y-3 max-h-96 overflow-y-auto">
                <p class="text-center text-xs text-gray-400 py-6">아직 제출된 소감이 없습니다.</p>
            </div>
        </div>
    </div>

    <script>
        const laws = [
            { title: "상황 1: 노인 승차 & 10대 지원금" },
            { title: "상황 2: 소득 20% 단일 세금" },
            { title: "상황 3: 외국인 학생 학비·급식비" },
            { title: "상황 4: 급식 고기 메뉴 매일 포함" },
            { title: "상황 5: 5인 이상 다가족 아파트 제공" },
            { title: "상황 6: 의료비 국가 전액 부담" }
        ];

        const TOPIC = 'moral_class_5_1_school_2026';
        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

        let currentLawIndex = 0;
        let isInputAllowed = true;
        let liveChart = null;
        let records = [];
        let reflections = [];

        client.on('connect', () => {
            document.getElementById('tcNetStatus').innerText = "🟢 서버 연동 완료";
            client.subscribe(TOPIC);
        });

        client.on('message', (topic, message) => {
            try {
                const data = JSON.parse(message.toString());
                if(data.type === 'NEW_SUBMISSION') {
                    records.push(data);
                    renderDashboard();
                }
                if(data.type === 'NEW_REFLECTION') {
                    reflections.push(data);
                    renderDashboard();
                }
            } catch(e){}
        });

        function tcNavLaw(dir) {
            currentLawIndex = Math.max(0, Math.min(laws.length - 1, currentLawIndex + dir));
            document.getElementById('tcCurrentLawTitle').innerText = laws[currentLawIndex].title;
            client.publish(TOPIC, JSON.stringify({ type: 'CHANGE_LAW', index: currentLawIndex }));
            renderDashboard();
        }

        function toggleStudentLock() {
            isInputAllowed = !isInputAllowed;
            updateLockUI();
            client.publish(TOPIC, JSON.stringify({ type: 'LOCK_TOGGLE', isAllowed: isInputAllowed }));
        }

        function updateLockUI() {
            const badge = document.getElementById('tcLockBadge');
            const btn = document.getElementById('tcLockToggleBtn');
            if(isInputAllowed) {
                badge.innerText = "🔓 입력 허용";
                badge.className = "px-3 py-1 bg-emerald-100 text-emerald-700 font-extrabold text-xs rounded-full";
                btn.innerText = "🔒 학생 입력 잠그기";
            } else {
                badge.innerText = "🔒 입력 잠금";
                badge.className = "px-3 py-1 bg-rose-100 text-rose-700 font-extrabold text-xs rounded-full";
                btn.innerText = "🔓 학생 입력 허용하기";
            }
        }

        function renderDashboard() {
            const filter = document.getElementById('tcLawFilter').value;
            let filteredRecords = records;
            if(filter !== 'all') filteredRecords = records.filter(r => r.lawIndex == filter);

            const total = filteredRecords.length;
            const v1Agree = filteredRecords.filter(r => r.vote1 === '찬성').length;
            const v2Agree = filteredRecords.filter(r => r.vote2 === '찬성').length;
            const changed = filteredRecords.filter(r => r.changed).length;

            document.getElementById('dashTotalCount').innerText = `${total}건`;
            document.getElementById('dashVote1Ratio').innerText = total ? `${Math.round((v1Agree/total)*100)}%` : '0%';
            document.getElementById('dashVote2Ratio').innerText = total ? `${Math.round((v2Agree/total)*100)}%` : '0%';
            document.getElementById('dashChangeRatio').innerText = total ? `${Math.round((changed/total)*100)}%` : '0%';

            const refContainer = document.getElementById('reflectionListContainer');
            if(!reflections.length) {
                refContainer.innerHTML = '<p class="text-center text-xs text-gray-400 py-6">아직 제출된 소감이 없습니다.</p>';
            } else {
                refContainer.innerHTML = reflections.slice().reverse().map(rf => `
                    <div class="p-4 bg-gray-50 rounded-2xl border text-xs space-y-2">
                        <div class="flex justify-between font-bold text-gray-800">
                            <span>👤 ${rf.name}</span>
                            <span class="text-indigo-600 font-bold">소감 제출 완료</span>
                        </div>
                        <p class="bg-white p-2.5 rounded-xl border text-gray-700"><strong>[캐릭터 삶 소감]:</strong> ${rf.ansChar}</p>
                        <p class="text-gray-600"><strong>1. 약자보호:</strong> ${rf.q1}</p>
                        <p class="text-gray-600"><strong>2. 타인이해:</strong> ${rf.q2}</p>
                        <p class="text-gray-600"><strong>3. 무지의 베일:</strong> ${rf.q3}</p>
                    </div>
                `).join('');
            }

            const ctx = document.getElementById('liveChart').getContext('2d');
            if(liveChart) liveChart.destroy();
            liveChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['1차 찬성', '1차 반대', '2차 찬성', '2차 반대'],
                    datasets: [{
                        label: '응답 수',
                        data: [v1Agree, total - v1Agree, v2Agree, total - v2Agree],
                        backgroundColor: ['#10b981', '#f43f5e', '#6366f1', '#fb7185']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function clearData() {
            if(confirm('데이터를 초기화하시겠습니까?')) {
                records = [];
                reflections = [];
                renderDashboard();
            }
        }
    </script>
</body>
</html>
